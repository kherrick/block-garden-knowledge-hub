<!doctype html>
<html lang="en">
  <head>
    <title>Block Garden - Page Not Found</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Block Garden - 404 Page Not Found" />
    <meta name="theme-color" content="#111c12" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg-color: #09110a;
        --card-bg: #111c12;
        --border-color: #1f3322;
        --text-primary: #ecfdf5;
        --text-secondary: #a7f3d0;
        --accent-green: #22c55e;
        --accent-hover: #16a34a;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-color);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: var(--text-primary);
      }
      .container {
        max-width: 480px;
        margin: 20px;
        padding: 40px 32px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .icon-container {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 12px;
        font-weight: 700;
        color: var(--text-primary);
      }
      p {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 28px;
      }
      .home-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        background-color: var(--accent-green);
        color: #09110a;
        font-weight: 600;
        text-decoration: none;
        border-radius: 8px;
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
      }
      .home-btn:hover {
        background-color: var(--accent-hover);
      }
    </style>
    <script>
      (function () {
        const l = window.location;
        const isLocalhost =
          l.hostname === "localhost" ||
          l.hostname === "127.0.0.1" ||
          l.hostname === "0.0.0.0";

        if (isLocalhost) return;

        // store the full path + query + hash for SPA router hydration
        sessionStorage.setItem(
          "shadow-claw-github-pages-404-redirect",
          l.pathname + l.search + l.hash,
        );

        // redirect to app base URL
        l.replace("/block-garden-knowledge-hub/");
      })();
    </script>
  </head>
  <body>
    <div class="container">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient
              id="grass-top-404"
              x1="2"
              y1="2"
              x2="30"
              y2="18"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#4ade80" />
              <stop offset="100%" stop-color="#16a34a" />
            </linearGradient>
            <linearGradient
              id="dirt-left-404"
              x1="2"
              y1="10"
              x2="16"
              y2="30"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#92400e" />
              <stop offset="100%" stop-color="#713f12" />
            </linearGradient>
            <linearGradient
              id="dirt-right-404"
              x1="16"
              y1="18"
              x2="30"
              y2="22"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#78350f" />
              <stop offset="100%" stop-color="#451a03" />
            </linearGradient>
          </defs>
          <path d="M16 2 L30 10 L16 18 L2 10 Z" fill="url(#grass-top-404)" />
          <path d="M2 10 L16 18 L16 30 L2 22 Z" fill="url(#dirt-left-404)" />
          <path d="M16 18 L30 10 L30 22 L16 30 Z" fill="url(#dirt-right-404)" />
          <path
            d="M2 10 L16 18 L16 22 L12 20 L10 22 L6 20 L2 22 Z"
            fill="#15803d"
          />
          <path
            d="M16 18 L30 10 L30 14 L26 16 L22 14 L18 16 L16 22 Z"
            fill="#166534"
          />
        </svg>
      </div>
      <h1>404 - Page Not Found</h1>
      <p>
        The Block Garden coordinates or knowledge node you requested could not
        be located.
      </p>
      <a href="./" class="home-btn">Return to Knowledge Hub</a>
    </div>
  </body>
</html>
